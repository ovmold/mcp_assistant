[project]
name = "mcp_assistant"
version = "0.1.0"
description = "Интеллектуальный ассистент на базе GigaChat или OpenAI и протокола Model Context Protocol (MCP). Умеет искать тикеты в базе данных (БД), работать с базой знаний (md-файлы), изменять статусы и добавлять комментарии, запрашивая подтверждение на выполнение этих действий"
readme = "README.md"
authors = [
    { name = "Ольга Молдованова", email = "ovmold@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.0",
    "fastapi>=0.162.0",
    "gigachat>=0.2.4",
    "gradio>=6.30.0",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "openai>=1.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.8",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

